# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- validate
- test
- secret-detection
- plan
- deploy
- cleanup

default:
  interruptible: true
  image:
    name: container-registry.oracle.com/os/oraclelinux:9
    entrypoint: [""]

# OCI credentials and the deployment target are supplied only through
# protected CI/CD variables. This prevents a credential change from retaining
# a target compartment belonging to a different tenancy.

terraform:format:
  stage: validate
  before_script:
    - bash scripts/ci-tools.sh terraform
  script:
    - terraform -chdir=terraform fmt -check -recursive

terraform:validate:
  stage: validate
  before_script:
    - bash scripts/ci-tools.sh terraform
  script:
    - terraform -chdir=terraform init -backend=false
    - terraform -chdir=terraform validate

kubernetes:render:
  stage: validate
  before_script:
    - bash scripts/ci-tools.sh kubectl
  script:
    - kubectl kustomize kubernetes

shell:syntax:
  stage: validate
  before_script:
    - bash scripts/ci-tools.sh shellcheck
  script:
    - shellcheck scripts/validate-lab.sh scripts/ci-tools.sh

# These cloud-changing jobs are deliberately manual. Configure the protected,
# masked variables listed in docs/gitlab-ci.md before using them.
.oci_terraform:
  interruptible: false
  before_script:
    - bash scripts/ci-tools.sh terraform
    - umask 077
    - printf '%s' "$OCI_PRIVATE_KEY_B64" | base64 -d > /tmp/oke-api-key.pem
    - chmod 600 /tmp/oke-api-key.pem
    - export TF_VAR_private_key_path=/tmp/oke-api-key.pem
    - export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/ospa2100-phoenix-oke-lab"
    - export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
    - export TF_HTTP_USERNAME=gitlab-ci-token
    - export TF_HTTP_PASSWORD="$CI_JOB_TOKEN"
    - export TF_HTTP_LOCK_METHOD=POST TF_HTTP_UNLOCK_METHOD=DELETE TF_HTTP_RETRY_WAIT_MIN=5
    - terraform -chdir=terraform init -input=false
  resource_group: oke-lab-test
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false

terraform:plan:
  extends: .oci_terraform
  stage: plan
  script:
    - terraform -chdir=terraform plan -input=false -out=lab.tfplan
  artifacts:
    access: maintainer
    expire_in: 1 day
    paths:
      - terraform/lab.tfplan
      - terraform/.terraform.lock.hcl

terraform:apply:
  extends: .oci_terraform
  stage: deploy
  dependencies:
    - terraform:plan
  script:
    - terraform -chdir=terraform apply -input=false lab.tfplan
  environment:
    name: oke-lab-test

terraform:destroy:
  extends: .oci_terraform
  stage: cleanup
  script:
    - terraform -chdir=terraform destroy -auto-approve
  environment:
    name: oke-lab-test
    action: stop
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection

oci:version:
  stage: validate
  before_script:
    - bash scripts/ci-tools.sh oci
  script:
    - oci --version
