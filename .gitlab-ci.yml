# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- validate
- test
- secret-detection
- plan
- deploy
- cleanup

default:
  interruptible: true
  image:
    name: container-registry.oracle.com/os/oraclelinux:9
    entrypoint: [""]

# OCI credentials and targets come from protected CI/CD variables or a trusted
# Luna launch. Never commit credentials or deployment targets to this file.

terraform:format:
  stage: validate
  before_script:
    - bash scripts/ci-tools.sh terraform
  script:
    - terraform -chdir=terraform fmt -check -recursive

terraform:validate:
  stage: validate
  before_script:
    - bash scripts/ci-tools.sh terraform
  script:
    - terraform -chdir=terraform init -backend=false
    - terraform -chdir=terraform validate

kubernetes:render:
  stage: validate
  before_script:
    - bash scripts/ci-tools.sh kubectl
  script:
    - kubectl kustomize kubernetes

shell:syntax:
  stage: validate
  before_script:
    - bash scripts/ci-tools.sh shellcheck
  script:
    - shellcheck scripts/*.sh

terraform:bootstrap-test:
  stage: validate
  before_script:
    - dnf install -y openssl diffutils python3 python3-pyyaml
  script:
    - bash scripts/test-terraform-ci.sh
    - python3 -m unittest discover -s scripts/tests -v

# Luna automatically provisions on the protected default branch. Only cleanup
# is manual in that pipeline: Luna starts manual jobs when the session ends.
.oci_terraform:
  interruptible: false
  before_script:
    - bash scripts/ci-tools.sh terraform
  variables:
    OKE_ENVIRONMENT: oke-lab-test
    # Disposable lab: public API, TCP 6443 from any IPv4 source. Auth is required.
    TF_VAR_control_plane_is_public: "true"
    TF_VAR_control_plane_allowed_cidrs: '["0.0.0.0/0"]'
  rules:
    - if: '$LUNA_DEPLOYMENT == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: on_success
      variables:
        OKE_ENVIRONMENT: luna/oke-$CI_PIPELINE_ID
    - if: '$LUNA_DEPLOYMENT != "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false

terraform:plan:
  extends: .oci_terraform
  stage: plan
  script:
    - bash scripts/terraform-ci.sh plan
  artifacts:
    access: maintainer
    expire_in: 1 day
    paths:
      - terraform/lab.tfplan
      - terraform/lab.target
      - terraform/.terraform.lock.hcl

terraform:apply:
  extends: .oci_terraform
  stage: deploy
  before_script:
    - bash scripts/ci-tools.sh terraform
    - bash scripts/ci-tools.sh oci
  dependencies:
    - terraform:plan
  script:
    - bash scripts/terraform-ci.sh apply
  environment:
    name: $OKE_ENVIRONMENT

terraform:destroy:
  extends: .oci_terraform
  stage: cleanup
  # Available after failed/partial provisioning, without expired plan artifacts.
  needs: []
  before_script:
    - bash scripts/ci-tools.sh terraform
    - bash scripts/ci-tools.sh oci
    - bash scripts/ci-tools.sh kubectl
  script:
    - bash scripts/terraform-ci.sh destroy
  rules:
    - if: '$LUNA_DEPLOYMENT == "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
      variables:
        OKE_ENVIRONMENT: luna/oke-$CI_PIPELINE_ID
    - if: '$LUNA_DEPLOYMENT != "1" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
  environment:
    name: $OKE_ENVIRONMENT
    action: stop
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection

oci:version:
  stage: validate
  before_script:
    - bash scripts/ci-tools.sh oci
  script:
    - oci --version
