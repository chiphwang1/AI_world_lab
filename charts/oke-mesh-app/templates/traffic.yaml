{{- if .Values.traffic.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-traffic
  labels:
    app: {{ .Release.Name }}-traffic
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-traffic
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-traffic
        version: v1
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: traffic
          image: {{ .Values.traffic.image | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl --fail --silent --show-error --max-time 5 http://{{ .Release.Name }}:80/ || true
                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
{{- end }}
